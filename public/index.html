const load=(key,fall)=>{try{return JSON.parse(localStorage.getItem('nova-'+key))??fall}catch{return fall}},save=(key,val)=>localStorage.setItem('nova-'+key,JSON.stringify(val));
let tasks=load('tasks',defaultTasks),inbox=load('inbox',['准备周末复习计划','研究知识库标签体系','整理课程资料']),currentPage='home',mode='focus',timerDuration=25*60,remaining=25*60,timerId=null,running=false,pomodoros=load('pomodoros',2),wordIndex=load('wordIndex',0),showAnswer=false,cet='CET-6',learnedToday=load('learnedToday',32),taskView='list';
const words={
'CET-6':[{w:'abandon',p:'/əˈbændən/',pos:'v.',m:'放弃；抛弃',e:'They had to abandon the plan.'},{w:'abstract',p:'/ˈæbstrækt/',pos:'adj.',m:'抽象的；理论上的',e:'The article begins with an abstract idea.'},{w:'accurate',p:'/ˈækjərət/',pos:'adj.',m:'准确的；精确的',e:'The report is based on accurate data.'},{w:'acquire',p:'/əˈkwaɪər/',pos:'v.',m:'获得；习得',e:'Children acquire language naturally.'},{w:'adapt',p:'/əˈdæpt/',pos:'v.',m:'适应；改编',e:'It takes time to adapt to a new routine.'},{w:'adequate',p:'/ˈædɪkwət/',pos:'adj.',m:'足够的；适当的',e:'We have adequate time to finish.'},{w:'advocate',p:'/ˈædvəkeɪt/',pos:'v./n.',m:'提倡；拥护者',e:'Many experts advocate regular exercise.'}],
'CET-4':[{w:'ability',p:'/əˈbɪləti/',pos:'n.',m:'能力；才能',e:'Practice can improve your ability.'},{w:'accept',p:'/əkˈsept/',pos:'v.',m:'接受；认可',e:'She accepted the invitation.'},{w:'achieve',p:'/əˈtʃiːv/',pos:'v.',m:'实现；达到',e:'Small steps help us achieve our goals.'},{w:'active',p:'/ˈæktɪv/',pos:'adj.',m:'积极的；活跃的',e:'He takes an active part in class.'},{w:'advantage',p:'/ədˈvæntɪdʒ/',pos:'n.',m:'优势；有利条件',e:'Good planning gives you an advantage.'},{w:'afford',p:'/əˈfɔːrd/',pos:'v.',m:'负担得起；提供',e:'They cannot afford to waste time.'},{w:'ancient',p:'/ˈeɪnʃənt/',pos:'adj.',m:'古代的；古老的',e:'The museum displays ancient art.'}]};
const meta={home:['工作台','把今天过得更清楚一点。'],inbox:['收件箱','先收集，再安排；灵感不会丢。'],today:['今日','今天的任务、日程和学习计划都在这里。'],tasks:['任务中心','把想法拆成下一步，让进度看得见。'],projects:['项目空间','工作、学习与生活计划的共同入口。'],calendar:['日历','按月查看任务、学习与重要安排。'],notes:['笔记','捕捉灵感，记录思考，连接项目。'],knowledge:['知识库','把零散资料整理成自己的知识系统。'],files:['文件中心','给文档、资料和项目附件一个家。'],focus:['专注模式','选定一件事，给它一段完整的注意力。'],pomodoro:['番茄钟','专注一段，再好好休息。'],english:['英语学习','通过新词、复习和记录，让进步持续发生。'],cet4:['CET-4 四级','今天从一个词开始。'],cet6:['CET-6 六级','循序渐进，把词汇变成长期记忆。'],vocab:['生词本与复习','把模糊的词收集起来，按间隔重复复习。'],habits:['习惯','细小的重复，正在组成长期变化。'],goals:['目标','让日常任务和长期方向保持连线。'],analytics:['数据统计','回看投入的时间，以及一点点积累的进步。'],notifications:['通知中心','把提醒、复习计划和更新集中在一处。'],settings:['设置','按自己的节奏调整 NOVA。']};
function icon(name){const paths={plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',spark:'<path d="m12 3 1.6 6.4L20 12l-6.4 2.6L12 21l-1.6-6.4L4 12l6.4-2.6z"/>',check:'<path d="m5 12 4 4L19 6"/>',play:'<path d="m8 5 11 7-11 7z"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.plus}</svg>`}
function header(page,action=''){let [title,desc]=meta[page]||meta.home;return `<div class="page-heading"><div><div class="eyebrow">NOVA / PERSONAL OS</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,note,color,symbol){return `<div class="card stat-card"><div class="stat-top"><span>${label}</span><span class="stat-icon" style="background:${color};color:#556d57">${symbol}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div><i class="stat-wash" style="background:${color}"></i></div>`}

function home(){let done=tasks.filter(t=>t.done).length;return `${header('home',`<button class="button" data-action="newTask">${icon('plus')} 新建任务</button>`)}
<div class="grid stats">${stat('今日任务',`${done}/${tasks.length}`,`${Math.round(done/(tasks.length||1)*100)}% 已完成`,'#e9eee6','✓')}${stat('专注时长','1h 40m','比昨日多 25 分钟','#f6eadf','◷')}${stat('今日单词',`${learnedToday}/60`,'复习计划完成 53%','#f2efe2','Aa')}${stat('活跃项目','4 个','2 个正在推进','#e5edf4','↗')}</div>
<div class="grid home-main"><section class="card welcome-card"><div class="hello" id="todayLong">星期二 · 2026年9月29日</div><h2 class="welcome-title">下午好，今天也从容一点。<span style="font-size:22px">☀</span></h2><div class="welcome-desc">把注意力放回眼前重要的事，小步向前就很好。</div><div class="welcome-row"><div class="welcome-metric"><strong id="taskProgress">${done}/${tasks.length}</strong><span>今日任务完成</span></div><div class="welcome-metric"><strong>01:40</strong><span>今日专注时间</span></div><div class="welcome-metric"><strong>${learnedToday}/60</strong><span>今日词汇目标</span></div></div><div class="welcome-progress progress"><i></i></div></section><section class="card cover-card"><img src="/assets/desk.jpg" alt="温暖的个人学习桌面"><div class="cover-content"><span class="cover-pill">A space for your best work</span><h3>给想法一个落脚点</h3><p>任务 · 笔记 · 学习，轻轻松松连在一起。</p></div></section></div>
<div class="grid home-lower"><div><section class="card panel"><div class="panel-head"><div><div class="panel-title">今天要做</div><div class="panel-sub">优先完成重要的一两件</div></div><button class="text-action" data-go="tasks">查看全部 →</button></div><div class="task-list">${tasks.slice(0,4).map(taskLine).join('')}</div></section>
<div class="section-row"><h2>正在推进</h2><span>4 个活跃项目</span></div><div class="grid project-grid">${projectMini('个人工作台','产品设计 · 8 个任务',68,'#67816c')}${projectMini('英语学习计划','CET-6 · 120 个新词',43,'#d49c6d')}${projectMini('阅读与输入','本月阅读 · 4 本',52,'#8097b6')}</div></div>
<div class="right-stack"><section class="card panel"><div class="panel-head"><div><div class="panel-title">今天的节奏</div><div class="panel-sub">专注安排，不必赶路</div></div><button class="text-action" data-go="calendar">日历 →</button></div><div class="schedule"><div class="schedule-row"><span class="time">09:00</span><i class="schedule-dot"></i><div><div class="event-title">CET-6 词汇复习</div><div class="event-detail">英语学习 · 30 分钟</div></div></div><div class="schedule-row"><span class="time">10:30</span><i class="schedule-dot orange"></i><div><div class="event-title">工作台原型迭代</div><div class="event-detail">个人工作台 · 深度工作</div></div></div><div class="schedule-row"><span class="time">14:00</span><i class="schedule-dot blue"></i><div><div class="event-title">课程小组讨论</div><div class="event-detail">线上会议 · 45 分钟</div></div></div><div class="schedule-row"><span class="time">19:30</span><i class="schedule-dot"></i><div><div class="event-title">散步与拉伸</div><div class="event-detail">习惯 · 给身体一点时间</div></div></div></div></section>
<section class="card word-card"><div class="word-top"><span class="word-title">今日一词 · CET-6</span><span class="word-counter">${wordIndex+1} / 60</span></div>${wordSnippet()}<div class="word-actions"><button data-word="again">模糊</button><button class="know" data-word="good">认识，继续 ${icon('arrow')}</button></div></section>

function goalsPage(){return `${header('goals',`<button class="button" data-action="newGoal">${icon('plus')} 新建目标</button>`)}<div class="grid content-grid"><section class="card panel"><div class="panel-head"><div><div class="panel-title">长期目标</div><div class="panel-sub">把愿望变成可以执行的里程碑</div></div><span class="pill">进行中</span></div>${goal('通过 CET-6 考试','预计 2026 年 12 月',58,'已掌握 2,138 / 4,500 个词')}${goal('完成个人工作台 v1','产品与开发',72,'完成首页与基础模块')}${goal('读完 12 本书','年度阅读',33,'已完成 4 / 12 本')}</section><section class="card panel"><div class="panel-title">下一步里程碑</div><div class="list-row">掌握 3,000 个 CET-6 词 <small>还差 862 词</small></div><div class="list-row">完成 20 套英语真题 <small>已完成 6 套</small></div><div class="list-row">发布工作台 V1 <small>预计 10 月</small></div><button class="button soft" style="margin-top:15px" data-go="tasks">关联一个任务 ${icon('arrow')}</button></section></div>`}
function goal(name,tag,pct,desc){return `<div class="goal-row"><div class="goal-top"><b>${name}</b><small>${tag}</small></div>${progress(pct)}<p>${desc}　·　${pct}%</p></div>`}
function analyticsPage(){return `${header('analytics')}<div class="grid stats">${stat('本周专注','12h 40m','较上周 +18%','#e9eee6','◷')}${stat('已完成任务','28 项','完成率 84%','#e5edf4','✓')}${stat('学习单词','218 个','复习正确率 86.7%','#f4eee1','Aa')}${stat('完成番茄','34 个','连续专注 3 次','#f5e8df','🍅')}</div><div class="grid content-grid"><section class="card panel"><div class="panel-head"><div><div class="panel-title">本周专注时间</div><div class="panel-sub">每天的深度工作投入</div></div><button class="select">近 7 天</button></div><div class="analytics-chart">${[36,72,54,87,65,96,42].map((h,i)=>`<div class="chart-col"><div class="chart-bar" style="height:${h}%"></div><small>${['一','二','三','四','五','六','日'][i]}</small></div>`).join('')}</div></section><section class="card panel"><div class="panel-head"><div class="panel-title">英语学习活跃度</div><span class="panel-sub">过去 4 周</span></div><div class="heatmap">${Array.from({length:56},(_,i)=>`<i class="heat" style="opacity:${.5+(i*13%5)*.12}"></i>`).join('')}</div><div class="panel-sub" style="margin-top:12px">坚持出现，比偶尔冲刺更重要。</div></section></div><div class="section-row"><h2>学习成果</h2><span>持续更新</span></div><div class="grid project-grid">${projectMini('CET-4 掌握率','目标词汇 · 4,500',78,'#d3a06f')}${projectMini('CET-6 掌握率','目标词汇 · 5,500',43,'#789276')}${projectMini('任务完成率','最近 30 天',84,'#8097b6')}</div>`}
function notificationsPage(){return `${header('notifications')}<section class="card panel"><div class="panel-head"><div class="panel-title">今天</div><button class="text-action">全部标记已读</button></div><div class="list-row"><span class="pill">英语学习</span><b>还有 42 个单词待复习</b><small>基于你的记忆节奏安排</small></div><div class="list-row"><span class="pill" style="background:#f5eee5;color:#a27553">任务提醒</span><b>“更新学习计划与周目标”明天到期</b><small>个人工作台 · 任务</small></div><div class="list-row"><span class="pill">习惯</span><b>今日阅读习惯还没打卡</b><small>今天 20:00</small></div></section><div class="section-row"><h2>昨天</h2></div><section class="card panel"><div class="list-row"><span class="pill">番茄钟</span><b>完成 2 个专注时段</b><small>累计 50 分钟</small></div></section>`}
function settingsPage(){return `${header('settings')}<div class="grid content-grid"><section class="card panel"><div class="panel-title">外观</div>${settingRow('深色模式','切换适合自己的显示风格',document.body.classList.contains('dark'))}<div class="settings-row"><div><b>强调色</b><small>调整工作台的点缀色</small></div><div class="theme-options"><button class="theme-dot" style="background:#456a53" data-accent="#456a53"></button><button class="theme-dot" style="background:#6d73a6" data-accent="#6d73a6"></button><button class="theme-dot" style="background:#cf8e5b" data-accent="#cf8e5b"></button><button class="theme-dot" style="background:#a96f8b" data-accent="#a96f8b"></button></div></div>${settingRow('桌面通知','计时结束时显示系统通知',false)}</section><section class="card panel"><div class="panel-title">工作习惯</div>${settingRow('任务完成时保存统计','更新每日完成量与项目进度',true)}${settingRow('英语间隔复习','按熟悉程度设置下次复习时间',true)}${settingRow('本地保存','数据仅保存在当前浏览器',true)}<div class="panel-sub" style="margin-top:13px">这个原型无需注册。清除浏览器数据会移除本地任务与学习进度。</div></section></div>`}
function settingRow(name,desc,on){return `<div class="settings-row"><div><b>${name}</b><small>${desc}</small></div><button class="switch ${on?'on':''}" data-switch></button></div>`}
function render(){let m=$('#main');const page=currentPage;if(page==='home')m.innerHTML=home();else if(page==='tasks')m.innerHTML=taskPage();else if(page==='today')m.innerHTML=pageTasksToday();else if(page==='projects')m.innerHTML=projectsPage();else if(page==='calendar')m.innerHTML=calendarPage();else if(page==='notes')m.innerHTML=notesPage();else if(page==='knowledge')m.innerHTML=knowledgePage();else if(page==='files')m.innerHTML=filesPage();else if(['focus','pomodoro'].includes(page))m.innerHTML=focusPage();else if(['english','cet4','cet6','vocab'].includes(page))m.innerHTML=englishPage(page);else if(page==='inbox')m.innerHTML=inboxPage();else if(page==='habits')m.innerHTML=habitsPage();else if(page==='goals')m.innerHTML=goalsPage();else if(page==='analytics')m.innerHTML=analyticsPage();else if(page==='notifications')m.innerHTML=notificationsPage();else if(page==='settings')m.innerHTML=settingsPage();else m.innerHTML=home();$('#crumbName').textContent=meta[page]?.[0]||'工作台';$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$$('.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(['pomodoro','focus'].includes(page)&&b.dataset.page==='pomodoro')));updateTimerDisplay();}
function navigate(page){currentPage=page;render();window.scrollTo({top:0,behavior:'smooth'});}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function updateTimerDisplay(){let el=$('#timerNumber');if(el)el.textContent=formatTime(remaining);let btn=$('#timerToggle');if(btn)btn.innerHTML=running?'Ⅱ 暂停':`${icon('play')} 开始专注`;let m=$('#timerMode');if(m)m.textContent=mode==='focus'?'FOCUS SESSION':mode==='short'?'SHORT BREAK':'LONG BREAK';}
function startTimer(){if(running){clearInterval(timerId);running=false;updateTimerDisplay();return}running=true;updateTimerDisplay();timerId=setInterval(()=>{remaining--;if(remaining<=0){clearInterval(timerId);running=false;if(mode==='focus'){pomodoros++;save('pomodoros',pomodoros);learnedToday=Math.min(60,learnedToday+1);save('learnedToday',learnedToday);mode=pomodoros%4===0?'long':'short';timerDuration=(mode==='long'?15:5)*60;remaining=timerDuration;toast('专注时段完成，休息一下吧。')}else{mode='focus';timerDuration=25*60;remaining=timerDuration;toast('休息结束，准备开始下一轮专注。')}if('Notification'in window&&Notification.permission==='granted')new Notification('NOVA · 番茄钟',{body:mode==='focus'?'休息结束，回到你的节奏。':'专注完成，记得休息。'});render()}else updateTimerDisplay()},1000)}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function openModal(title,content){$('#modal').innerHTML=`<div class="modal-head">${title}<button class="modal-close" data-close>×</button></div>${content}`;$('#modalBackdrop').classList.add('open');setTimeout(()=>$('#modal input,#modal textarea')?.focus(),50)}function closeModal(){$('#modalBackdrop').classList.remove('open')}
function newTask(){openModal('新建任务',`<form id="modalTaskForm"><input class="input" name="title" placeholder="任务名称" required><div style="height:9px"></div><textarea class="input" name="details" placeholder="描述或备注（可选）"></textarea><div style="display:flex;gap:8px;margin-top:9px"><select class="select" name="priority"><option>中</option><option>高</option><option>低</option></select><select class="select" name="project"><option>个人工作台</option><option>英语学习</option><option>自我提升</option></select><select class="select" name="due"><option>今天</option><option>明天</option><option>周五</option></select></div><div class="modal-actions"><button type="button" class="button ghost" data-close>取消</button><button class="button">创建任务</button></div></form>`)}
function quickCapture(){openModal('快速捕获',`<form id="captureForm"><textarea class="input" name="text" placeholder="现在想到什么？先记下来，之后再整理…" required></textarea><div class="modal-actions"><button type="button" class="button ghost" data-close>取消</button><button class="button">放入收件箱</button></div></form>`)}
function applyWordRating(rating){let gap={again:10,hard:1,good:3,easy:7}[rating]||3;learnedToday=Math.min(60,learnedToday+1);save('learnedToday',learnedToday);wordIndex++;save('wordIndex',wordIndex);showAnswer=false;toast(`已记录 · 下次复习 ${gap===10?'10 分钟':gap+' 天'}后`);render()}
function searchModal(){openModal('快速搜索',`<input class="input" id="globalSearch" placeholder="搜索任务、笔记、项目… 或输入命令" autocomplete="off"><div id="searchResults" style="margin-top:13px"></div><div class="panel-sub" style="margin-top:12px">快捷操作　·　新建任务　·　开始专注　·　打开日历</div>`);let el=$('#globalSearch');el.addEventListener('input',()=>{let q=el.value.toLowerCase();let matches=[...tasks.map(t=>({title:t.title,page:'tasks',type:'任务'})),...notes.map(n=>({title:n.title,page:'notes',type:'笔记'})),...Object.values(words).flat().map(w=>({title:`${w.w} — ${w.m}`,page:'english',type:'单词'}))].filter(x=>x.title.toLowerCase().includes(q)||x.type.toLowerCase().includes(q)).slice(0,6);$('#searchResults').innerHTML=q?matches.map(x=>`<div class="list-row" data-search-go="${x.page}"><span class="tag">${x.type}</span><b>${safe(x.title)}</b><small>打开 →</small></div>`).join('')||'<div class="empty">没有找到匹配内容</div>':[['新建任务','创建一条任务'],['开始番茄钟','专注 25 分钟'],['打开日历','查看安排']].map((x,i)=>`<div class="list-row" data-command="${['newTask','pomodoro','calendar'][i]}"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')})}
function doAction(action){if(action==='newTask')newTask();if(action==='quick')quickCapture();if(action==='newNote'){notes.unshift({title:'未命名笔记',tag:'收件箱',body:''});navigate('notes');toast('新笔记已创建，可直接编辑。')}if(action==='reveal'){showAnswer=true;render()}if(action==='resetTimer'){clearInterval(timerId);running=false;remaining=timerDuration;updateTimerDisplay()}if(action==='skipTimer'){clearInterval(timerId);running=false;mode=mode==='focus'?'short':'focus';timerDuration=(mode==='focus'?25:5)*60;remaining=timerDuration;render()}if(action==='today')render();if(action==='monthPrev'||action==='monthNext')toast('日历月份已切换');if(action==='upload')toast('文件上传将在启用文件存储后开放。');if(action==='newHabit'||action==='newGoal')toast('已打开新建入口');}
function bindEvents(){document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){navigate(n.dataset.page);return}let go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return}let action=e.target.closest('[data-action]');if(action){doAction(action.dataset.action);return}if(e.target.closest('#openSearch')){searchModal();return}if(e.target.closest('#quickBtn')){quickCapture();return}if(e.target.closest('#notifyBtn')){navigate('notifications');return}if(e.target.closest('#timerToggle')){startTimer();return}let tog=e.target.closest('[data-toggle-task]');if(tog){let t=tasks.find(x=>x.id==tog.dataset.toggleTask);if(t){t.done=!t.done;save('tasks',tasks);render()}return}let w=e.target.closest('[data-word]');if(w){applyWordRating(w.dataset.word);return}if(e.target.closest('#flashcard')){showAnswer=!showAnswer;render();return}let c=e.target.closest('[data-cet]');if(c){cet=c.dataset.cet;wordIndex=0;showAnswer=false;render();return}let preset=e.target.closest('[data-preset]');if(preset){clearInterval(timerId);running=false;let v=+preset.dataset.preset;timerDuration=v*60;remaining=timerDuration;render();toast(`专注时长设为 ${v} 分钟`);return}let sw=e.target.closest('[data-switch]');if(sw){sw.classList.toggle('on');return}let accent=e.target.closest('[data-accent]');if(accent){document.documentElement.style.setProperty('--green',accent.dataset.accent);document.documentElement.style.setProperty('--green2',accent.dataset.accent+'22');toast('主题色已更新');return}let close=e.target.closest('[data-close]');if(close){closeModal();return}let result=e.target.closest('[data-search-go]');if(result){let p=result.dataset.searchGo;closeModal();navigate(p);return}let cmd=e.target.closest('[data-command]');if(cmd){let a=cmd.dataset.command;closeModal();if(a==='newTask')newTask();else navigate(a);return}let view=e.target.closest('[data-task-view]');if(view){taskView=view.dataset.taskView==='board'?'board':'list';render();return}let note=e.target.closest('[data-note]');if(note){let x=notes[+note.dataset.note];$('#noteTitle').value=x.title;$('#noteBody').value=x.body;$$('.note-item').forEach(b=>b.classList.toggle('active',b===note));return}let checkin=e.target.closest('[data-habit-today]');if(checkin){checkin.textContent='已打卡 ✓';checkin.classList.add('ghost');toast('习惯记录已保存');return}let day=e.target.closest('[data-habit]');if(day){day.classList.toggle('on');return}let convert=e.target.closest('[data-convert]');if(convert&&convert.value!=='整理为…'){let i=+convert.dataset.convert,text=inbox[i];if(convert.value==='任务'){tasks.unshift({id:Date.now(),title:text,done:false,priority:'中',project:'个人工作台',due:'今天'});save('tasks',tasks)}inbox.splice(i,1);save('inbox',inbox);render();toast('已整理到'+convert.value);return}let del=e.target.closest('[data-inbox-delete]');if(del){inbox.splice(+del.dataset.inboxDelete,1);save('inbox',inbox);render()}});
document.addEventListener('submit',e=>{if(e.target.id==='taskAddForm'){e.preventDefault();let inp=$('#taskInput'),v=inp.value.trim();if(!v)return;tasks.unshift({id:Date.now(),title:v,done:false,priority:'中',project:'个人工作台',due:'今天'});save('tasks',tasks);render();toast('任务已添加');return}if(e.target.id==='modalTaskForm'){e.preventDefault();let d=new FormData(e.target);tasks.unshift({id:Date.now(),title:d.get('title'),done:false,priority:d.get('priority'),project:d.get('project'),due:d.get('due')});save('tasks',tasks);closeModal();render();toast('任务已创建');return}if(e.target.id==='captureForm'){e.preventDefault();let d=new FormData(e.target);inbox.unshift(d.get('text'));save('inbox',inbox);closeModal();if(currentPage==='inbox')render();toast('已放入收件箱');return}if(e.target.id==='inboxForm'){e.preventDefault();let inp=$('#inboxInput'),v=inp.value.trim();if(v){inbox.unshift(v);save('inbox',inbox);render();toast('已收集到收件箱')}return}});
$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#mobileMenu').addEventListener('click',()=>toast('手机端请使用底部导航'));document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}if((e.metaKey||e.ctrlKey)&&e.key===' '){e.preventDefault();quickCapture()}if(e.key==='Escape')closeModal()});}
function init(){let d=new Date();let dateStr=d.toLocaleDateString('zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});let el=$('#todayLong');if(el)el.textContent=dateStr;render();bindEvents()}
init();
</script>
</body>
</html>
