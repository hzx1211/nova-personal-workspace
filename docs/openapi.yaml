          schema: {$ref: '#/components/schemas/SettingsEnvelope'}
  schemas:
    Uuid:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 timestamp. Responses are normalized to UTC with Z suffix.
      example: '2026-09-29T09:45:00Z'
    DateOnly:
      type: string
      format: date
      description: ISO 8601 local calendar date; it is not a UTC timestamp.
      example: '2026-09-29'
    Pagination:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: {type: [string, 'null'], description: Opaque; null means no next page.}
        hasMore: {type: boolean}
    Problem:
      type: object
      description: RFC 9457-style problem response; extensions carry field errors and a trace identifier.
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference, example: https://api.example.com/problems/validation-error}
        title: {type: string, example: Validation failed}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string, example: VALIDATION_ERROR}
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
        requestId: {type: string}
    InboxItem:
      type: object
      required: [id, title, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        body: {type: [string, 'null']}
        status: {type: string, enum: [open, processed, archived]}
        source: {type: [string, 'null']}
        processedAt: {$ref: '#/components/schemas/NullableDateTime'}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        updatedAt: {$ref: '#/components/schemas/DateTime'}
    InboxItemInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        body: {type: [string, 'null'], maxLength: 20000}
        source: {type: [string, 'null'], maxLength: 100}
    InboxItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        body: {type: [string, 'null'], maxLength: 20000}
        source: {type: [string, 'null'], maxLength: 100}
        status: {type: string, enum: [open, processed, archived]}
    Task:
      type: object
      required: [id, title, status, priority, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        description: {type: [string, 'null']}
        status: {type: string, enum: [todo, in_progress, done, cancelled]}
        priority: {type: string, enum: [low, medium, high, urgent]}
        dueAt: {$ref: '#/components/schemas/NullableDateTime'}
        completedAt: {$ref: '#/components/schemas/NullableDateTime'}
        projectId: {$ref: '#/components/schemas/NullableUuid'}
        estimatedMinutes: {type: [integer, 'null'], minimum: 1}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        updatedAt: {$ref: '#/components/schemas/DateTime'}
    TaskInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        description: {type: [string, 'null'], maxLength: 20000}
        status: {type: string, enum: [todo, in_progress, done, cancelled], default: todo}
        priority: {type: string, enum: [low, medium, high, urgent], default: medium}
        dueAt: {$ref: '#/components/schemas/NullableDateTime'}
        projectId: {$ref: '#/components/schemas/NullableUuid'}
        estimatedMinutes: {type: [integer, 'null'], minimum: 1}
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        description: {type: [string, 'null'], maxLength: 20000}
        status: {type: string, enum: [todo, in_progress, done, cancelled]}
        priority: {type: string, enum: [low, medium, high, urgent]}
        dueAt: {$ref: '#/components/schemas/NullableDateTime'}
        projectId: {$ref: '#/components/schemas/NullableUuid'}
        estimatedMinutes: {type: [integer, 'null'], minimum: 1}
    Project:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        description: {type: [string, 'null']}
        status: {type: string, enum: [active, on_hold, completed, archived]}
        color: {type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$'}
        startDate: {$ref: '#/components/schemas/NullableDateOnly'}
        targetDate: {$ref: '#/components/schemas/NullableDateOnly'}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        updatedAt: {$ref: '#/components/schemas/DateTime'}
    ProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 20000}
        status: {type: string, enum: [active, on_hold, completed, archived], default: active}
        color: {type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$'}
        startDate: {$ref: '#/components/schemas/NullableDateOnly'}
        targetDate: {$ref: '#/components/schemas/NullableDateOnly'}
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 20000}
        status: {type: string, enum: [active, on_hold, completed, archived]}
        color: {type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$'}
        startDate: {$ref: '#/components/schemas/NullableDateOnly'}
        targetDate: {$ref: '#/components/schemas/NullableDateOnly'}
    CalendarEvent:
      type: object
      required: [id, title, startsAt, endsAt, allDay, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        description: {type: [string, 'null']}
        startsAt: {$ref: '#/components/schemas/DateTime'}
        endsAt: {$ref: '#/components/schemas/DateTime'}
        allDay: {type: boolean}
        timezone: {type: string, example: Asia/Shanghai}
        location: {type: [string, 'null']}
        taskId: {$ref: '#/components/schemas/NullableUuid'}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        updatedAt: {$ref: '#/components/schemas/DateTime'}
    CalendarEventInput:
      type: object
      additionalProperties: false
      required: [title, startsAt, endsAt]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        description: {type: [string, 'null'], maxLength: 20000}
        startsAt: {$ref: '#/components/schemas/DateTime'}
        endsAt: {$ref: '#/components/schemas/DateTime'}
        allDay: {type: boolean, default: false}
        timezone: {type: string, maxLength: 64, default: UTC}
        location: {type: [string, 'null'], maxLength: 500}
        taskId: {$ref: '#/components/schemas/NullableUuid'}
    CalendarEventPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        description: {type: [string, 'null'], maxLength: 20000}
        startsAt: {$ref: '#/components/schemas/DateTime'}
        endsAt: {$ref: '#/components/schemas/DateTime'}
        allDay: {type: boolean}
        timezone: {type: string, maxLength: 64}
        location: {type: [string, 'null'], maxLength: 500}
        taskId: {$ref: '#/components/schemas/NullableUuid'}
    Note:
      type: object
      required: [id, title, content, pinned, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        content: {type: string}
        contentFormat: {type: string, enum: [markdown, plain_text]}
        pinned: {type: boolean}
        tags: {type: array, items: {type: string}}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        updatedAt: {$ref: '#/components/schemas/DateTime'}
    NoteInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        content: {type: string, maxLength: 100000, default: ''}
        contentFormat: {type: string, enum: [markdown, plain_text], default: markdown}
        pinned: {type: boolean, default: false}
        tags: {type: array, maxItems: 50, items: {type: string, maxLength: 50}}
    NotePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        content: {type: string, maxLength: 100000}
        contentFormat: {type: string, enum: [markdown, plain_text]}
        pinned: {type: boolean}
        tags: {type: array, maxItems: 50, items: {type: string, maxLength: 50}}
    FileAsset:
      type: object
      required: [id, name, mimeType, sizeBytes, storageKey, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        mimeType: {type: string}
        sizeBytes: {type: integer, minimum: 0}
        storageKey: {type: string, description: Opaque storage reference; not a public URL.}
        downloadUrl: {type: [string, 'null'], format: uri, description: Short-lived signed URL if available.}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        updatedAt: {$ref: '#/components/schemas/DateTime'}
    FileInput:
      type: object
      additionalProperties: false
      required: [name, mimeType, sizeBytes, storageKey]
      properties:
        name: {type: string, minLength: 1, maxLength: 512}
        mimeType: {type: string, maxLength: 255}
        sizeBytes: {type: integer, minimum: 0}
        storageKey: {type: string, minLength: 1, maxLength: 1024}
    FilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 512}
    LearningDeck:
      type: object
      required: [id, code, name, exam, totalWords, dueCount, learnedCount]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, example: cet4-core}
        name: {type: string, example: CET-4 Core Vocabulary}
        exam: {type: string, enum: [CET4, CET6]}
        totalWords: {type: integer, minimum: 0}
        dueCount: {type: integer, minimum: 0}
        learnedCount: {type: integer, minimum: 0}
    ReviewQueueItem:
      type: object
      required: [wordId, spelling, definition, state, dueAt]
      properties:
        wordId: {$ref: '#/components/schemas/Uuid'}
        spelling: {type: string}
        phonetic: {type: [string, 'null']}
        definition: {type: string}
        example: {type: [string, 'null']}
        state: {type: string, enum: [new, learning, review]}
        dueAt: {$ref: '#/components/schemas/NullableDateTime'}
        reviewProgressId: {$ref: '#/components/schemas/NullableUuid'}
    ReviewSubmission:
      type: object
      additionalProperties: false
      required: [wordId, clientAttemptId, answer, responseMs]
      properties:
        wordId: {$ref: '#/components/schemas/Uuid'}
        clientAttemptId: {type: string, format: uuid}
        answer: {type: string, enum: [again, hard, good, easy]}
        responseMs: {type: integer, minimum: 0, maximum: 3600000}
    ReviewResult:
      type: object
      required: [attemptId, wordId, answer, nextDueAt, intervalDays, repetitions, reviewedAt]
      properties:
        attemptId: {$ref: '#/components/schemas/Uuid'}
        wordId: {$ref: '#/components/schemas/Uuid'}
        answer: {type: string, enum: [again, hard, good, easy]}
